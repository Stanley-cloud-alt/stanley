<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>QR code</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f2f45"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body><div class="w"><a class="back" href="index.html">← 回到總覽</a><h1>QR code</h1><p class="sub">請在網站上線後，用正式網址開啟本頁再列印。每層一個 QR，貼在對應那一層。</p><div class="qr" id="q"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>var I=[["layer1", "第一層・主食", "小葉種紅茶"], ["layer2", "第二層・麵包", "青心烏龍"], ["layer3", "第三層・甜點", "金萱烏龍"]],B=location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/,"");
I.forEach(function(x){var d=document.createElement("div"),c=document.createElement("div"),u=B+x[0]+".html";c.className="c";d.appendChild(c);d.appendChild(document.createTextNode(x[1]+"（配"+x[2]+"）"));document.getElementById("q").appendChild(d);
if(window.QRCode){new QRCode(c,{text:u,width:150,height:150,correctLevel:QRCode.CorrectLevel.M})}else{c.textContent=u}});</script><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script></body></html>
